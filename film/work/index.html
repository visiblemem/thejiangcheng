<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Film — Jiang Cheng</title>
  <link rel="stylesheet" href="../../styles.css?v=20260813-3">
  <link rel="stylesheet" href="./work.css?v=20260816-work-page-2">
</head>
<body class="film-work-page">
  <div class="noise"></div>

  <header class="site-nav work-nav">
    <a class="brand" href="../../"><b>JIANG CHENG</b><span>蔣誠</span></a>
    <nav class="nav-links"><a href="../">FILM</a><a href="../../music/">MUSIC</a><a href="../../writing/">WRITING</a><a href="../../collaborations/">COLLABORATIONS</a><a href="../../about/">ABOUT</a></nav>
    <a class="work-back" href="../" aria-label="Back to Film">BACK TO FILM</a>
  </header>

  <main class="work-main" aria-live="polite">
    <div class="work-loading" hidden>LOADING WORK…</div>

    <article class="work-object" hidden>
      <section class="work-media" aria-label="Film player">
        <video class="work-video" controls playsinline preload="metadata"></video>
      </section>

      <section class="work-information">
        <div class="work-index">
          <span class="work-code"></span>
          <span class="work-year"></span>
        </div>

        <div class="work-copy">
          <h1 class="work-title"></h1>
          <p class="work-description"></p>
        </div>
      </section>

      <section class="work-details">
        <div class="work-details-label">CREDITS</div>
        <div class="work-credits"></div>
      </section>

      <section class="work-actions" aria-label="Work actions">
        <button class="work-share" type="button">SHARE</button>
        <button class="work-copy-link" type="button">COPY LINK</button>
        <div class="work-external-links"></div>
      </section>

      <nav class="work-pagination" aria-label="Film navigation">
        <a class="work-prev" href="../" hidden><small>PREVIOUS</small><span></span></a>
        <a class="work-next" href="../" hidden><small>NEXT</small><span></span></a>
      </nav>
    </article>

    <section class="work-error" hidden>
      <span>FILM ARCHIVE</span>
      <h1>Work not found.</h1>
      <a href="../">RETURN TO FILM</a>
    </section>
  </main>

  <script src="../../main.js?v=20260813-3"></script>
  <script src="../media-config.js?v=20260814-r2-2"></script>
  <script src="./work.js?v=20260816-work-page-2"></script>
</body>
</html>
